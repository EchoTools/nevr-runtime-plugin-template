# A tag v<version> (the version in echo-mod.json, a semantic version: semver.org) builds the mod,
# checks it, attests the release files (a build attestation that shows they were built here, from this
# tag) and opens a DRAFT GitHub release with exactly three files:
#
#   <id>-v<version>-windows.zip   the DLL, LICENSE, NOTICE, the settings sheet and a SHA256SUMS
#   echo-mod.json                 the manifest, with the package name and the source
#   SHA256SUMS                    the zip and echo-mod.json
#
# The draft is not live. The project's release signer signs the DLL inside the zip and publishes the
# release; you never upload anything. A version with a prerelease part (1.2.0-beta.1) becomes a
# prerelease.
#
# Keep this file as it is: the signer only takes releases that this workflow built, and it compares
# this file with the template's. Two jobs, on purpose: the one that builds and attests can't write to
# the repo, the one that writes the release runs no build code.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 cmake ninja-build wine wine64 python3
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      # GITHUB_SHA, the tag's commit, goes into the DLL as its NEVR-PLUGIN-BUILD identity.
      - name: Build, smoke test, check
        run: tools/ci-build.sh "$GITHUB_REF_NAME"

      - name: Package
        run: |
          file=$(python3 -c 'import json; print(json.load(open("echo-mod.json"))["file"])')
          python3 tools/package.py --dll "build/mingw/$file"

      # What the launcher's catalogue and the release signer expect of every release, by this repo's own
      # reviewed checker (nothing is fetched here: this job can attest). A release they would refuse is
      # never drafted.
      - name: Check the release
        run: python3 tools/check_mod.py --published dist --tag "$GITHUB_REF_NAME" --smoke build/smoke/smoke.json

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          pre=$(jq -r 'if .prerelease then "--prerelease" else "" end' dist/echo-mod.json)
          gh release create "$TAG" dist/* -R "$REPO" --draft --verify-tag --title "$TAG" --generate-notes $pre
