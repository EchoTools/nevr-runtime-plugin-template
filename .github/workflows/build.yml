# Every push and pull request: the gate `just verify` runs on your machine. Format, lint, build with
# warnings as errors, load the DLL under Wine, check the release it would make, run the tests. The
# DLL is kept as an artifact to try out (Mods -> Add DLL in the launcher, with local plugins on).
name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mingw-w64 cmake ninja-build wine wine64 python3 clang-format shellcheck
          # The posix thread model: std::mutex and std::thread work (linked statically).
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      # just fmt-check, just lint
      - name: Format and lint
        run: |
          clang-format --dry-run --Werror src/*.cpp src/*.h tests/smoke_host.c
          shellcheck tools/*.sh
          python3 -I -m py_compile tools/*.py tests/*.py

      # just check: build with -Werror, the Wine smoke test, the manifest and DLL checks
      - name: Build, smoke test, check
        run: tools/ci-build.sh

      # just check, second half: what a release of this commit would publish, by this repo's checker.
      - name: Release check
        run: |
          file=$(python3 -c 'import json; print(json.load(open("echo-mod.json"))["file"])')
          version=$(python3 -c 'import json; print(json.load(open("echo-mod.json"))["version"])')
          python3 tools/package.py --dll "build/mingw/$file" --out build/dist
          python3 tools/check_mod.py --published build/dist --tag "v$version"

      # just test
      - name: Tests
        run: |
          python3 tests/test_check_pr_title.py
          python3 tests/test_check_mod.py

      - name: Name
        id: name
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          m = json.load(open("echo-mod.json"))
          print("file=" + m["file"])
          print("version=" + m["version"])
          print("settings=" + (m.get("settings") if isinstance(m.get("settings"), str) else ""))
          PY

      # The DLL and its settings sheet (<Stem>.plugin.json): put both into the game's plugins folder.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.file }}-${{ steps.name.outputs.version }}-${{ github.sha }}
          path: |
            build/mingw/${{ steps.name.outputs.file }}
            ${{ steps.name.outputs.settings }}
